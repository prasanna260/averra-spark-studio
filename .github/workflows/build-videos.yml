name: Build portfolio videos

# Runs when the video list changes (or by hand) and commits web-ready copies
# of the Drive videos to public/videos.
on:
  push:
    paths:
      - scripts/videos.json
      - scripts/build-videos.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-videos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Download and transcode
        run: ./scripts/build-videos.sh
      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then echo "No new videos"; exit 0; fi
          git commit -m "Add web-ready portfolio videos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
